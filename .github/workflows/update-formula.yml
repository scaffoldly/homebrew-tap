name: update-formula

# Self-updating tap: this workflow lives in the tap repo and commits to itself
# with the repo's own GITHUB_TOKEN (contents: write) — no cross-repo PAT. It
# polls kubectl-add's public releases and re-renders the formula when a newer
# one appears. workflow_dispatch triggers an immediate bump.
on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: render latest formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo scaffoldly/kubectl-add --json tagName -q .tagName)
          ver="${tag#v}"
          if grep -q "version \"${ver}\"" Formula/kubectl-add.rb 2>/dev/null; then
            echo "formula already at ${ver}"
            exit 0
          fi
          echo "bumping formula to ${ver}"
          mkdir -p Formula
          REPO=scaffoldly/kubectl-add ./render.sh "$tag" > Formula/kubectl-add.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/kubectl-add.rb
          git diff --cached --quiet || git commit -m "kubectl-add ${tag}"
          git push
